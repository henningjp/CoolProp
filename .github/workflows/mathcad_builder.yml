name: Mathcad wrapper

on:
  # ========= Run on Pushes and Pull_Requests
  push:
    branches: [ 'master', 'main', 'develop', 'actions_mathcad' ]
    tags: [ 'v*' ]
  pull_request:
  # ========= Run on call from other workflows
  workflow_call:

concurrency:
  # Cancel superseded runs on the same ref to cut CI backlog on heavy
  # dev days (repeated pushes to an open PR).  Protected: master / main
  # / develop and tags never cancel, so mainline + release runs always
  # complete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    # Get the PTC build library and header in the proper location
    - name: Get dependencies
      shell: bash
      run: |
        mkdir "Custom Functions"
        cd "Custom Functions"        
        cp ../wrappers/MathCAD/Prime/libs/MCADINCL.H .
        cp ../wrappers/MathCAD/Prime/libs/mcaduser.lib .

    - name: Cache CPM packages
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.cpm_cache
        key: cpm-${{ runner.os }}-${{ hashFiles('cmake/dependencies.cmake') }}
        restore-keys: |
          cpm-${{ runner.os }}-

    - name: Configure CMake
      run: cmake -DCOOLPROP_PRIME_MODULE:BOOL=ON -DCOOLPROP_PRIME_ROOT:STRING="${{ github.workspace }}" -B build -S .

    - name: Build
      # `$(nproc)` is empty in the default Windows pwsh shell (nproc is a
      # GNU coreutils binary, not a pwsh command), collapsing to a bare `-j`.
      # Run under Git-Bash and resolve the core count portably. Mirrors
      # csharp_builder.yml / library_shared.yml.
      shell: bash
      run: |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)
        echo "Building with -j$JOBS"
        cmake --build build --target CoolPropMathcadWrapper -j "$JOBS" --config Release
        cmake --build build --target install --config Release

    # Direct IF97 add-in (no CoolProp), shipped in MathcadPrime/IF97-only.  Built
    # from the same IF97 commit CoolProp itself pins in cmake/dependencies.cmake,
    # once with SI units (Pa, J) and once with IAPWS units (MPa, kJ).  The two DLLs
    # define the same if97_ functions, so the README tells users to install only one.
    - name: Build IF97-only add-ins
      shell: bash
      run: |
        set -euo pipefail

        # The IF97 pin is the GIT_TAG line of the IF97 CPMAddPackage block
        IF97_TAG=$(awk '/NAME[[:space:]]+IF97[[:space:]]*$/ {f=1} f && /GIT_TAG/ {print $2; exit}' cmake/dependencies.cmake | tr -d '\r')
        if [[ ! "$IF97_TAG" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Could not read the IF97 GIT_TAG from cmake/dependencies.cmake (got '$IF97_TAG')"
          exit 1
        fi
        echo "Building IF97 at $IF97_TAG"

        git clone --quiet https://github.com/CoolProp/IF97 if97_src
        git -C if97_src checkout --quiet "$IF97_TAG"

        JOBS=$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)

        cmake -S if97_src -B build_if97_si \
          -DIF97_PRIME_MODULE:BOOL=ON \
          -DIF97_PRIME_ROOT:STRING="${{ github.workspace }}" \
          -DIF97_PRIME_DLL_NAME:STRING=IF97-SI
        cmake --build build_if97_si --config Release -j "$JOBS"

        cmake -S if97_src -B build_if97_iapws \
          -DIF97_PRIME_MODULE:BOOL=ON \
          -DIF97_PRIME_ROOT:STRING="${{ github.workspace }}" \
          -DIF97_PRIME_DLL_NAME:STRING=IF97-IAPWS \
          -DIF97_IAPWS_UNITS:BOOL=ON
        cmake --build build_if97_iapws --config Release -j "$JOBS"

        # Stage.  `cp` fails (and set -e stops the step) if any file is missing.
        DEST=install_root/MathcadPrime/IF97-only
        mkdir -p "$DEST"
        cp build_if97_si/Release/IF97-SI.dll "$DEST/"
        cp build_if97_iapws/Release/IF97-IAPWS.dll "$DEST/"
        cp if97_src/wrapper/Mathcad/Units/if97_Units_SI.mcdx "$DEST/"
        cp if97_src/wrapper/Mathcad/Units/if97_Units_IAPWS.mcdx "$DEST/"
        cp wrappers/MathCAD/Prime/IF97-only/README.md "$DEST/"
        # Example worksheet(s) kept next to the README in this repository
        for f in wrappers/MathCAD/Prime/IF97-only/*.mcdx; do
          [ -e "$f" ] && cp "$f" "$DEST/"
        done
        ls -l "$DEST"

    - name: Archive artifacts
      uses: actions/upload-artifact@v7
      with:
          name: MathcadPrime
          path: install_root/MathcadPrime
